version: 1
name: tk5-logoff
description: Leave ISPF with X, log off at READY and end on the logon screen.
inputs: []
outputs: []
timeouts:
  step: 10.0
  run: 120.0
  finally: 30.0
steps:
- kind: expect
  signatures:
  - ispf-primary-menu
- kind: type
  text: X
- kind: key
  key: enter
- kind: expect
  signatures:
  - tso-ready
- kind: type
  text: LOGOFF
- kind: key
  key: enter
- kind: expect
  signatures:
  - tk5-logon
finally: []
