version: 1
name: tk5-library-members
description: List the member names of a partitioned data set (library) by name (TSO LISTDS with MEMBERS). MEMBERS holds one member name per line, in the host's order, up to 200. MEMBER_COUNT is the number of names in MEMBERS. A longer list stops the call with an error. An empty MEMBERS means the library has no members or does not exist. Call tk5-dataset-info to tell the two apart. Read-only.
example: Which members does SYS2.JCLLIB have?
inputs:
- name: userid
  type: str
  required: true
  max_length: 8
  secret: false
  regex: '[A-Za-z0-9@#$]{1,8}'
  description: TSO user id.
- name: password
  type: str
  required: true
  max_length: 8
  secret: true
  description: TSO password.
- name: dsname
  type: str
  required: true
  max_length: 44
  secret: false
  regex: '[A-Za-z$#@][A-Za-z0-9$#@]{0,7}(?:\.[A-Za-z$#@][A-Za-z0-9$#@]{0,7}){0,21}'
  description: Data set name, e.g. SYS2.JCLLIB, any case. Up to 44 characters. Dot-separated qualifiers of 1-8 characters, each starting with a letter, dollar, number sign or at sign, then letters, digits or those.
outputs:
- name: MEMBERS
  type: str
  signature: tso-ready
  row: 7
  col: 3
  length: 8
  next_row: 0
  max_rows: 200
- name: MEMBER_COUNT
  type: int
  signature: tso-ready
  row: 7
  col: 3
  length: 8
  counts: MEMBERS
timeouts:
  step: 10.0
  run: 20.0
  finally: 6.0
steps:
- kind: handle
  signature: tk5-logo
  max_count: 1
  settle: 3.0
  steps:
  - kind: key
    key: enter
- kind: handle
  signature: tso-input-not-recognized
  max_count: 1
  settle: 0.0
  steps:
  - kind: key
    key: clear
- kind: expect
  signatures:
  - tk5-logon
- kind: type
  input: userid
- kind: key
  key: enter
- kind: handle
  signature: tso-userid-in-use
  max_count: 1
  settle: 0.0
  steps:
  - kind: type
    text: 'LOGON '
  - kind: type
    input: userid
  - kind: type
    text: ' RECONNECT'
  - kind: key
    key: enter
- kind: expect
  signatures:
  - tso-password-prompt
  - tso-reconnect-password-prompt
- kind: type
  input: password
- kind: key
  key: enter
- kind: handle
  signature: tso-reconnect-ok
  max_count: 1
  settle: 0.0
  steps:
  - kind: key
    key: enter
- kind: handle
  signature: tso-pause
  max_count: 10
  settle: 0.0
  steps:
  - kind: key
    key: enter
- kind: handle
  signature: tso-reenter
  max_count: 3
  settle: 0.0
  steps:
  - kind: key
    key: pa
    n: 1
- kind: handle
  signature: tso-ready
  max_count: 1
  settle: 0.0
  steps:
  - kind: key
    key: clear
- kind: handle
  signature: tso-cleared
  max_count: 1
  settle: 0.0
  steps:
  - kind: type
    text: LOGOFF
  - kind: key
    key: enter
- kind: expect
  signatures:
  - ispf-primary-menu
- kind: type
  text: X
- kind: key
  key: enter
- kind: expect
  signatures:
  - tso-ready
- kind: key
  key: clear
- kind: expect
  signatures:
  - tso-cleared
- kind: type
  text: LISTDS '
- kind: type
  input: dsname
- kind: type
  text: ''' MEMBERS'
- kind: key
  key: enter
- kind: expect
  signatures:
  - tso-ready
  - tso-pause
  - tso-reenter
- kind: collect
  output: MEMBERS
  more: tso-pause
  max_screens: 10
- kind: key
  key: clear
- kind: expect
  signatures:
  - tso-cleared
- kind: type
  text: LOGOFF
- kind: key
  key: enter
- kind: expect
  signatures:
  - tk5-logon
finally:
- kind: handle
  signature: ispf-primary-menu
  max_count: 1
  settle: 0.0
  steps:
  - kind: type
    text: X
  - kind: key
    key: enter
- kind: handle
  signature: tso-pause
  max_count: 20
  settle: 0.0
  steps:
  - kind: key
    key: enter
- kind: handle
  signature: tso-reenter
  max_count: 3
  settle: 0.0
  steps:
  - kind: key
    key: pa
    n: 1
- kind: handle
  signature: tso-ready
  max_count: 1
  settle: 0.0
  steps:
  - kind: key
    key: clear
- kind: handle
  signature: tso-cleared
  max_count: 1
  settle: 0.0
  steps:
  - kind: type
    text: LOGOFF
  - kind: key
    key: enter
- kind: expect
  signatures:
  - tk5-logon
