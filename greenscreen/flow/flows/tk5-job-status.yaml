version: 1
name: tk5-job-status
description: List the jobs of the mainframe account by running the TSO STATUS command. JOBS holds one line per job with job name, job id and state. The account's own TSO session appears as EXECUTING. Read-only. Logs on and off with the bound account.
example: Which jobs are running for this account?
inputs:
- name: userid
  type: str
  required: true
  max_length: 8
  secret: false
  regex: '[A-Za-z0-9@#$]{1,8}'
  description: TSO user id.
- name: password
  type: str
  required: true
  max_length: 8
  secret: true
  description: TSO password.
outputs:
- name: JOBS
  type: str
  signature: tso-ready
  row: 1
  col: 1
  length: 79
  next_row: 0
  max_rows: 40
timeouts:
  step: 10.0
  run: 20.0
  finally: 6.0
steps:
- kind: handle
  signature: tk5-logo
  max_count: 1
  settle: 3.0
  steps:
  - kind: key
    key: enter
- kind: handle
  signature: tso-input-not-recognized
  max_count: 1
  settle: 0.0
  steps:
  - kind: key
    key: clear
- kind: expect
  signatures:
  - tk5-logon
- kind: type
  input: userid
- kind: key
  key: enter
- kind: handle
  signature: tso-userid-in-use
  max_count: 1
  settle: 0.0
  steps:
  - kind: type
    text: 'LOGON '
  - kind: type
    input: userid
  - kind: type
    text: ' RECONNECT'
  - kind: key
    key: enter
- kind: expect
  signatures:
  - tso-password-prompt
  - tso-reconnect-password-prompt
- kind: type
  input: password
- kind: key
  key: enter
- kind: handle
  signature: tso-reconnect-ok
  max_count: 1
  settle: 0.0
  steps:
  - kind: key
    key: enter
- kind: handle
  signature: tso-pause
  max_count: 10
  settle: 0.0
  steps:
  - kind: key
    key: enter
- kind: handle
  signature: tso-reenter
  max_count: 3
  settle: 0.0
  steps:
  - kind: key
    key: pa
    n: 1
- kind: handle
  signature: tso-ready
  max_count: 1
  settle: 0.0
  steps:
  - kind: key
    key: clear
- kind: handle
  signature: tso-cleared
  max_count: 1
  settle: 0.0
  steps:
  - kind: type
    text: LOGOFF
  - kind: key
    key: enter
- kind: expect
  signatures:
  - ispf-primary-menu
- kind: type
  text: X
- kind: key
  key: enter
- kind: expect
  signatures:
  - tso-ready
- kind: key
  key: clear
- kind: expect
  signatures:
  - tso-cleared
- kind: type
  text: STATUS
- kind: key
  key: enter
- kind: expect
  signatures:
  - tso-ready
  - tso-pause
- kind: collect
  output: JOBS
  more: tso-pause
  max_screens: 3
- kind: key
  key: clear
- kind: expect
  signatures:
  - tso-cleared
- kind: type
  text: LOGOFF
- kind: key
  key: enter
- kind: expect
  signatures:
  - tk5-logon
finally:
- kind: handle
  signature: ispf-primary-menu
  max_count: 1
  settle: 0.0
  steps:
  - kind: type
    text: X
  - kind: key
    key: enter
- kind: handle
  signature: tso-pause
  max_count: 20
  settle: 0.0
  steps:
  - kind: key
    key: enter
- kind: handle
  signature: tso-reenter
  max_count: 3
  settle: 0.0
  steps:
  - kind: key
    key: pa
    n: 1
- kind: handle
  signature: tso-ready
  max_count: 1
  settle: 0.0
  steps:
  - kind: key
    key: clear
- kind: handle
  signature: tso-cleared
  max_count: 1
  settle: 0.0
  steps:
  - kind: type
    text: LOGOFF
  - kind: key
    key: enter
- kind: expect
  signatures:
  - tk5-logon
