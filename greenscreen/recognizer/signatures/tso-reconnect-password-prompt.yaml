version: 1
name: tso-reconnect-password-prompt
description: Password prompt of a LOGON RECONNECT, two rows below the normal prompt.
matchers:
- kind: region_regex
  row: 2
  col: 0
  length: 80
  pattern: ^ IKJ56714A ENTER CURRENT PASSWORD FOR [^ ]{1,8}- *$
- kind: cursor_field
  row: 3
  col: 0
  hidden: true
volatile: []
