[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenscreen-connector"
version = "0.1.0"
description = "Headless IBM 3270 terminal session connector driving the s3270/ws3270 binary as a subprocess."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
publish = [
    "mcp>=2.3,<3",
    "fastapi>=0.163,<1",
]
dev = [
    "greenscreen-connector[publish]",
    "hypothesis>=6.170.15",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "setuptools>=70.1",
]

[project.scripts]
greenscreen-publish = "greenscreen.publisher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["greenscreen*"]

[tool.setuptools.package-data]
"greenscreen.connector.testing" = ["fixtures/*.yaml"]
"greenscreen.recognizer.signatures" = ["*.yaml"]
"greenscreen.flow.flows" = ["*.yaml"]
"greenscreen.publisher.console" = ["*.html", "*.css", "*.js", "*.json", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: marks tests as requiring a live TN3270 host (deselect with -m 'not integration')",
    "perf: timing assertion that a slow machine can deselect with -m 'not perf'",
]
