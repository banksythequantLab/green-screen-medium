[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenscreen-connector"
version = "0.1.0"
description = "Headless IBM 3270 terminal session connector driving the s3270/ws3270 binary as a subprocess."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["greenscreen*"]

[tool.setuptools.package-data]
"greenscreen.connector.testing" = ["fixtures/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: marks tests as requiring a live TN3270 host (deselect with -m 'not integration')",
]
